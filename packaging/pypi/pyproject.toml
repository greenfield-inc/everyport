[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "port-process-manager"
dynamic = ["version"]
description = "See every dev server on your machine, or any box you can reach"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Greenfield" }]
keywords = ["ports", "dev-server", "localhost", "process", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/greenfield-inc/port-process-manager"
Repository = "https://github.com/greenfield-inc/port-process-manager"
Issues = "https://github.com/greenfield-inc/port-process-manager/issues"

[project.scripts]
ppm = "port_process_manager:main"
port-process-manager = "port_process_manager:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
port_process_manager = ["SHA256SUMS"]

# scripts/dist.sh writes VERSION from Cargo.toml.
[tool.setuptools.dynamic]
version = { file = "VERSION" }
