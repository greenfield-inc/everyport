[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "port-process-manager"
version = "0.1.0"
description = "See every dev server on your machine, or any box you can reach"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Greenfield" }]
keywords = ["ports", "dev-server", "process", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/greenfield-inc/port-process-manager"
Issues = "https://github.com/greenfield-inc/port-process-manager/issues"

[project.scripts]
ppm = "port_process_manager:main"
port-process-manager = "port_process_manager:main"

[tool.setuptools.packages.find]
where = ["src"]
