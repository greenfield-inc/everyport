[workspace]
resolver = "2"
members = ["crates/ppm-core", "crates/ppm", "crates/ppm-client", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/greenfield-inc/port-process-manager"

[workspace.dependencies]
ppm-core = { path = "crates/ppm-core" }
ppm-client = { path = "crates/ppm-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
sysinfo = "0.39"
listeners = "0.6"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
