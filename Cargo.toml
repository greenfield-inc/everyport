[workspace]
resolver = "2"
members = ["crates/everyport-core", "crates/everyport", "crates/everyport-client", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/greenfield-inc/everyport"
homepage = "https://github.com/greenfield-inc/everyport"
readme = "README.md"
keywords = ["ports", "dev-server", "localhost", "process", "cli"]

[workspace.dependencies]
everyport-core = { path = "crates/everyport-core", version = "0.1.0" }
everyport-client = { path = "crates/everyport-client", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
ts-rs = "12"
sysinfo = "0.39"
listeners = "0.6"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
