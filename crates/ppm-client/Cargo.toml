[package]
name = "ppm-client"
description = "Connects to ppm locally or on a remote machine and streams its protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ppm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
# TLS through ring rather than reqwest's default aws-lc-rs: it cross-builds with zig for the musl ppm.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
base64 = "0.22"
toml = "0.9"
dirs = "6"

[dev-dependencies]
base64 = "0.22"
