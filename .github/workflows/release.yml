# A v* tag push builds, signs and publishes a release. Run it by hand on a
# branch for a dry run: everything builds unsigned and is kept as workflow
# artifacts, and nothing is published. Run it by hand on a tag with unsigned
# for a test release.
name: Release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      unsigned:
        description: On a tag, publish without signing and notarization (test releases only)
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      sign: ${{ github.ref_type == 'tag' && !inputs.unsigned }}
    secrets: inherit

  github:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: release, path: release }
      - run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env: { GH_TOKEN: "${{ github.token }}" }

  crates:
    if: github.ref_type == 'tag'
    needs: github
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # crates.io trusts this workflow directly (trusted publishing), so there is no token.
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { toolchain: stable }
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish -p everyport --locked
        env: { CARGO_REGISTRY_TOKEN: "${{ steps.auth.outputs.token }}" }

  npm:
    if: github.ref_type == 'tag'
    needs: github
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      # npm trusts this workflow directly (trusted publishing) from npm 11.5.1 on.
      - run: npm install --global npm@11
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: packages, path: packages }
      - run: npm publish packages/everyport-*.tgz --provenance --access public

  pypi:
    if: github.ref_type == 'tag'
    needs: github
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PyPI trusts this workflow directly (trusted publishing), so there is no token.
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: packages, path: packages }
      - run: mkdir dist && mv packages/everyport-*.whl packages/everyport-*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  homebrew:
    if: github.ref_type == 'tag'
    needs: github
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: packages, path: packages }
      - run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::Skipping the Homebrew tap update: HOMEBREW_TAP_TOKEN is not set."
            exit 0
          fi
          git clone "https://x-access-token:$TAP_TOKEN@github.com/greenfield-inc/homebrew-tap.git" tap
          cp -R packages/homebrew/. tap/
          cd tap
          git add Formula Casks
          if git diff --cached --quiet; then
            echo "The tap already has these files."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "everyport $GITHUB_REF_NAME"
          git push
        env: { TAP_TOKEN: "${{ secrets.HOMEBREW_TAP_TOKEN }}" }
