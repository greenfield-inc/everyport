# Builds everything a release ships and tests the installers against it.
# CI and Release both call this. It never publishes anything.
name: Build
on:
  workflow_call:
    inputs:
      sign:
        description: Sign and notarize the bundles, and fail when a signing secret is missing
        type: boolean
        default: false

jobs:
  binaries:
    name: everyport ${{ matrix.name || matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, build: zigbuild }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, build: zigbuild }
          # One runner builds both macOS targets, since macOS runners are the scarce
          # ones. It still finishes before the macOS app jobs need their sidecar.
          - { name: apple-darwin, target: aarch64-apple-darwin x86_64-apple-darwin, os: macos-latest, build: build }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, build: build, exe: .exe }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, build: build, exe: .exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { toolchain: stable, targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: ". -> target.noindex", key: "${{ matrix.name || matrix.target }}", save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - if: matrix.build == 'zigbuild'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with: { version: 0.14.1 }
      - if: matrix.build == 'zigbuild'
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with: { tool: cargo-zigbuild }
      - name: Build
        shell: bash
        run: |
          mkdir out
          for target in ${{ matrix.target }}; do
            cargo ${{ matrix.build }} -p everyport --release --locked --target "$target"
            cp "target.noindex/$target/release/everyport${{ matrix.exe }}" "out/everyport-$target${{ matrix.exe }}"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "bin-${{ matrix.name || matrix.target }}", path: out/*, if-no-files-found: error }

  bundles:
    name: app ${{ matrix.target }}
    # No needs: the app compiles while the binaries jobs run, then bundles its
    # target's released everyport as the sidecar.
    permissions: { contents: read, actions: read }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, bundles: dmg, cli: apple-darwin }
          - { target: x86_64-apple-darwin, os: macos-latest, bundles: dmg, cli: apple-darwin }
          # The .msi installs per machine and needs admin. install-app.ps1 uses the per-user NSIS setup.exe.
          - { target: x86_64-pc-windows-msvc, os: windows-latest, bundles: "msi,nsis" }
          # The static musl everyport serves as the sidecar on glibc Linux too.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, bundles: "deb,rpm,appimage", sidecar: x86_64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { toolchain: stable, targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: ". -> target.noindex", key: "app-${{ matrix.target }}", save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # The WINDOWS_SIGNING repository variable set to skip ships an unsigned .msi from a signed release.
      - name: Skip Windows signing
        if: inputs.sign && runner.os == 'Windows' && vars.WINDOWS_SIGNING == 'skip'
        run: Write-Output "::warning::WINDOWS_SIGNING is skip, so this release ships an unsigned .msi. macOS is still signed and notarized."
        shell: pwsh

      - name: Import the Windows signing certificate
        if: inputs.sign && runner.os == 'Windows' && vars.WINDOWS_SIGNING != 'skip'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Output "::error::Signed builds need the WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD secrets. To ship an unsigned .msi, set the WINDOWS_SIGNING repository variable to skip. For a test release, run Release with unsigned."
            exit 1
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } |
            ConvertTo-Json -Depth 4 | Set-Content (Join-Path $env:RUNNER_TEMP 'tauri-signing.json')
          Write-Output "Signing with certificate $($cert.Thumbprint)."

      - name: Build the app
        shell: bash
        env:
          # Not SIGN: the AppImage plugin gpg-signs whenever SIGN is set.
          EVERYPORT_SIGN: ${{ inputs.sign && !(runner.os == 'Windows' && vars.WINDOWS_SIGNING == 'skip') }}
          # Tauri skips the Finder step that lays out the DMG window when CI is true.
          TAURI_BUNDLER_DMG_IGNORE_CI: true
          # The binaries job that builds the sidecar, and the sidecar's target.
          CLI: bin-${{ matrix.cli || matrix.sidecar || matrix.target }}
          SIDECAR: ${{ matrix.sidecar || matrix.target }}
          GH_TOKEN: ${{ github.token }}
          APPLE_CERTIFICATE: ${{ inputs.sign && secrets.CSC_LINK || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.sign && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ inputs.sign && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ inputs.sign && secrets.APPLE_TEAM_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.sign && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: |
          args=(--target ${{ matrix.target }})
          if [ "$EVERYPORT_SIGN" = true ]; then
            if [ "$RUNNER_OS" = macOS ]; then
              for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_PASSWORD; do
                if [ -z "${!name}" ]; then
                  echo "::error::Signed builds need the CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_TEAM_ID and APPLE_APP_SPECIFIC_PASSWORD secrets. For a test release, run Release with unsigned."
                  exit 1
                fi
              done
            fi
            if [ "$RUNNER_OS" = Windows ]; then
              args+=(--config "$RUNNER_TEMP/tauri-signing.json")
            fi
          else
            # Tauri treats a set but empty variable as a certificate to import.
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_PASSWORD
            if [ "$RUNNER_OS" = macOS ]; then
              export APPLE_SIGNING_IDENTITY=-
            fi
            echo "::notice::Unsigned build: signing and notarization are skipped."
          fi
          # Compile against a placeholder sidecar. The bundler reads src-tauri/binaries
          # only when bundling, so the placeholder never ships.
          touch "$RUNNER_TEMP/placeholder"
          # apps/desktop/scripts/sidecar.mjs copies EVERYPORT_SIDECAR instead of building one.
          EVERYPORT_SIDECAR="$RUNNER_TEMP/placeholder" pnpm --filter @everyport/desktop tauri build --no-bundle "${args[@]}"

          # Bundle this target's released everyport once its binaries job uploads it.
          for attempt in $(seq 90); do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$CLI" --dir sidecar && break
            [ "$attempt" = 90 ] && { echo "::error::$CLI was not uploaded within 15 minutes."; exit 1; }
            sleep 10
          done
          # Artifacts drop the executable bit, and the sidecar script keeps the mode it copies.
          chmod +x sidecar/*
          EVERYPORT_SIDECAR="$(ls sidecar/everyport-"$SIDECAR"*)" TAURI_ENV_TARGET_TRIPLE=${{ matrix.target }} node apps/desktop/scripts/sidecar.mjs
          pnpm --filter @everyport/desktop tauri bundle "${args[@]}" --bundles ${{ matrix.bundles }}
      - name: Collect bundles
        shell: bash
        run: |
          shopt -s nullglob
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "everyport") | .version')"
          arch="${{ matrix.target }}"
          arch="${arch%%-*}"
          mkdir out
          for file in target.noindex/${{ matrix.target }}/release/bundle/*/*.{dmg,msi,deb,rpm,AppImage}; do
            cp "$file" "out/everyport-$version-$arch.${file##*.}"
          done
          for file in target.noindex/${{ matrix.target }}/release/bundle/nsis/*-setup.exe; do
            cp "$file" "out/everyport-$version-$arch-setup.exe"
          done
          ls -l out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "bundle-${{ matrix.target }}", path: out/*, if-no-files-found: error }

  dist:
    needs: [binaries, bundles]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: artifacts, merge-multiple: true }
      # The unsigned .deb shows the bundles ship the released everyport as the
      # sidecar. Signing changes the macOS and Windows copies.
      - name: Check the bundled sidecar
        run: |
          mkdir deb
          (cd deb && ar x ../artifacts/everyport-*.deb && tar xf data.tar.*)
          cmp deb/usr/bin/everyport-sidecar artifacts/everyport-x86_64-unknown-linux-musl
          rm -r deb
      - run: scripts/dist.sh artifacts
      - name: Check the npm and PyPI packages
        run: |
          npm publish --dry-run ./dist/packages/everyport-*.tgz
          uvx twine check --strict dist/packages/everyport-*.whl dist/packages/everyport-*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: release, path: dist/release, if-no-files-found: error }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: packages, path: dist/packages, if-no-files-found: error }

  install:
    name: install on ${{ matrix.os }}
    needs: dist
    # Without this, a skipped bundles job skips this job too.
    if: ${{ !cancelled() && needs.dist.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: release, path: dist/release }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: packages, path: dist/packages }
      - run: scripts/smoke-install.sh dist
        shell: bash
