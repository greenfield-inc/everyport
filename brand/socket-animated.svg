<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="socket" data-state="running">
  <!--
    Motion reference. Set data-state on the root: "idle", "running" or "attention".
    Changing to "idle" fades the lit slot out (unplug).
  -->
  <style>
    .socket { --main: #1b1d1b; --accent: #2f9a5d; --warn: #ffb224; overflow: visible; }
    @media (prefers-color-scheme: dark) { .socket { --main: #f2f4f0; --accent: #7fd89d; } }
    #mark { fill: var(--main); transition: transform 160ms ease-out; }
    #face { fill: none; stroke: var(--main); }
    #slot-right { fill: color-mix(in oklab, var(--main) 35%, transparent); transition: fill 400ms ease-in; }
    .socket:hover #mark { transform: translateY(-1px); }

    [data-state="running"] #slot-right { fill: var(--accent); animation: plug-in 400ms ease-out; }
    [data-state="attention"] #slot-right { fill: var(--warn); animation: breathe 2.4s ease-in-out infinite; }

    @keyframes plug-in { from { clip-path: inset(100% 0 0 0); } }
    @keyframes breathe { 50% { fill-opacity: 0.6; } }

    @media (prefers-reduced-motion: reduce) {
      #mark, #slot-right { animation: none !important; transition: none !important; }
    }
  </style>
  <g id="mark">
    <rect id="face" x="3" y="3" width="18" height="18" rx="6" stroke-width="2"/>
    <rect id="slot-left" x="8" y="8" width="2.4" height="6.5" rx="1.2"/>
    <rect id="slot-right" x="13.6" y="8" width="2.4" height="6.5" rx="1.2"/>
    <circle id="ground" cx="12" cy="16.4" r="1.3"/>
  </g>
</svg>
